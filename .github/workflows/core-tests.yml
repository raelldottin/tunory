name: Core CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          git rev-parse HEAD
          printf 'TUNORY_CI_MERGE_SHA=%s\n' "$(git rev-parse HEAD)"
          swift --version
          xcodebuild -version
      - name: Run core tests
        run: swift test --package-path Packages/TunoryCore --scratch-path "$RUNNER_TEMP/tunory-core-tests"
      - name: Test agent review CLI
        run: python3 -B -m unittest discover -s Tools/GitHub/tests -v
